name: Body Systems Explorer CI

on:
  pull_request:
    paths: ['body-systems/**', '.github/workflows/body-systems-ci.yml']
  push:
    branches: [main]
    paths: ['body-systems/**', '.github/workflows/body-systems-ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: body-systems
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: body-systems/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
